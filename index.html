<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <!-- Verhindert das automatische Heranzoomen beim Tippen auf iPhones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PR Planung</title>

    <!-- Web App Konfiguration (Homescreen-Icon & Name) -->
    <meta name="theme-color" content="#2563eb">
    <link rel="manifest" href="manifest.json">
    
    <!-- Spezielle Einstellungen für Apple iOS (iPhone/iPad) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="PR-Termine">
    <link rel="apple-touch-icon" href="icon.png">

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f3f4f6; color: #1f2937; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h1 { font-size: 1.5rem; margin-top: 0; text-align: center; }
        h2 { font-size: 1.2rem; margin-top: 25px; border-bottom: 2px solid #e5e7eb; padding-bottom: 8px; }
        input { width: 100%; padding: 12px; margin: 10px 0 20px; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        button { background-color: #2563eb; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; transition: all 0.2s; }
        button:hover { background-color: #1d4ed8; }
        .date-card { border: 1px solid #e5e7eb; padding: 15px; border-radius: 8px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .btn-group button { width: 48%; padding: 10px; }
        .btn-yes { background-color: #10b981; } .btn-yes:hover { background-color: #059669; }
        .btn-no { background-color: #ef4444; } .btn-no:hover { background-color: #dc2626; }
        .btn-small { width: auto; padding: 6px 12px; font-size: 14px; margin-left: 5px; }
        .btn-edit { background-color: #f59e0b; } .btn-edit:hover { background-color: #d97706; }
        .hidden { display: none; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 15px; }
        th, td { border: 1px solid #e5e7eb; padding: 12px; text-align: left; }
        th { background-color: #f9fafb; font-size: 14px; text-transform: uppercase; color: #6b7280; }
        td { vertical-align: top; }
        details { cursor: pointer; }
        summary { outline: none; margin-bottom: 5px; }
        .admin-date-row { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #e5e7eb; }
        .add-date-box { display: flex; gap: 10px; margin-bottom: 15px; }
        .add-date-box input { margin: 0; }
        .add-date-box button { width: auto; white-space: nowrap; }
        .status-info { font-size: 13px; padding: 10px 12px; border-radius: 6px; background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; margin-bottom: 12px; word-break: break-word; }
    </style>
</head>
<body>

<div class="container" id="loginScreen">
    <h1>Anmeldung zur PR-Sitzung</h1>
    <p style="text-align: center; color: #6b7280; font-size: 14px;">Bitte Vor- und Nachnamen eingeben</p>
    <input type="text" id="userName" placeholder="z.B. Max Mustermann" oninput="checkAdminInput()">
    
    <!-- Passwortfeld erscheint nur bei Eingabe von "admin" -->
    <div id="adminPasswordBox" class="hidden">
        <input type="password" id="adminPassword" placeholder="Admin-Passwort eingeben">
    </div>
    
    <button onclick="login()">Weiter</button>
</div>

<div class="container hidden" id="userScreen">
    <h1 id="greeting"></h1>
    <p>Bitte geben Sie Ihre Verfügbarkeit für die kommenden Termine an. Sie können Ihre Auswahl jederzeit ändern:</p>
    <div id="dateList">Lade Termine...</div>
</div>

<div class="container hidden" id="adminScreen" style="max-width: 650px;">
    <h1>Admin Bereich</h1>
    
    <h2>Termine verwalten</h2>
    <div class="add-date-box">
        <input type="date" id="newDateInput">
        <button onclick="addDate()">+ Hinzufügen</button>
    </div>
    <div id="adminStatusMsg" class="status-info">Bereit.</div>
    <div id="adminDateList" style="margin-bottom: 20px;">Lade Termine...</div>

    <h2>Rückmeldungen</h2>
    <div id="adminData">Lade Daten...</div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwvaF0vydA8Jc8FbOdBUnFzyLqFk2FH3dOiBqkNpzzTqgsli_YZILwr6uVtt9TGN0bq/exec";
    let currentUser = "";

    function apiFetch(paramsStr) {
        const sep = paramsStr.includes("?") ? "&" : "?";
        const url = `${API_URL}${paramsStr}${sep}_t=${Date.now()}`;
        return fetch(url, { cache: "no-store" });
    }

    function showAdminStatus(msg, isError = false) {
        const box = document.getElementById("adminStatusMsg");
        box.classList.remove("hidden");
        box.style.background = isError ? "#fef2f2" : "#eff6ff";
        box.style.color = isError ? "#991b1b" : "#1e40af";
        box.style.borderColor = isError ? "#fecaca" : "#bfdbfe";
        box.textContent = String(msg);
    }

    function checkAdminInput() {
        const val = document.getElementById("userName").value.trim().toLowerCase();
        const pwBox = document.getElementById("adminPasswordBox");
        if (val === "admin") {
            pwBox.classList.remove("hidden");
        } else {
            pwBox.classList.add("hidden");
            document.getElementById("adminPassword").value = "";
        }
    }

    function login() {
        currentUser = document.getElementById("userName").value.trim();
        if (currentUser === "") {
            showAdminStatus("Bitte geben Sie einen Namen ein.", true);
            alert("Bitte geben Sie einen Namen ein.");
            return;
        }
        
        if (currentUser.toLowerCase() === "admin") {
            const pw = document.getElementById("adminPassword").value;
            if (pw !== "admin") {
                alert("Falsches Admin-Passwort!");
                return;
            }
            document.getElementById("loginScreen").classList.add("hidden");
            document.getElementById("adminScreen").classList.remove("hidden");
            loadAdminDates();
            loadAdminData();
        } else {
            document.getElementById("loginScreen").classList.add("hidden");
            document.getElementById("userScreen").classList.remove("hidden");
            document.getElementById("greeting").innerText = "Hallo, " + currentUser;
            loadDates();
        }
    }

    function formatToGermanDate(isoDate) {
        if (!isoDate) return "";
        const parts = isoDate.split("-");
        if (parts.length !== 3) return isoDate;
        return `${parts[2]}.${parts[1]}.${parts[0]}`;
    }

    function loadAdminDates() {
        const listDiv = document.getElementById("adminDateList");
        listDiv.innerHTML = "Lade Termine...";
        apiFetch("?action=getDates")
            .then(res => {
                if (!res.ok) throw new Error("HTTP " + res.status);
                return res.text();
            })
            .then(txt => {
                const dates = JSON.parse(txt);
                if (!Array.isArray(dates) || dates.length === 0) {
                    listDiv.innerHTML = "<p style='color:#6b7280; font-style:italic;'>Keine Termine vorhanden.</p>";
                    return;
                }
                let html = "";
                dates.forEach(date => {
                    html += `
                        <div class="admin-date-row">
                            <span style="font-weight: bold;">${date}</span>
                            <div>
                                <button class="btn-small btn-edit" onclick="editDate('${date}')">Ändern</button>
                                <button class="btn-small btn-no" onclick="deleteDate('${date}')">Löschen</button>
                            </div>
                        </div>
                    `;
                });
                listDiv.innerHTML = html;
            })
            .catch(err => {
                console.error("loadAdminDates error:", err);
                listDiv.innerHTML = "Fehler beim Laden der Termine.";
                showAdminStatus("Fehler beim Laden der Termine: " + (err && err.message ? err.message : err), true);
            });
    }

    function addDate() {
        const rawDate = document.getElementById("newDateInput").value;
        if (!rawDate) {
            showAdminStatus("Bitte wählen Sie ein Datum aus.", true);
            return;
        }
        const formattedDate = formatToGermanDate(rawDate);
        document.getElementById("adminDateList").innerHTML = "Speichere...";
        
        apiFetch(`?action=addDate&date=${encodeURIComponent(formattedDate)}`)
            .then(res => {
                if (!res.ok) throw new Error("HTTP " + res.status);
                return res.text();
            })
            .then(txt => {
                const data = JSON.parse(txt);
                document.getElementById("newDateInput").value = "";
                showAdminStatus(`Termin ${data.date || formattedDate} hinzugefügt.`);
                loadAdminDates();
            })
            .catch(err => {
                console.error("addDate error:", err);
                showAdminStatus("Fehler beim Hinzufügen: " + (err && err.message ? err.message : err), true);
                loadAdminDates();
            });
    }

    function editDate(oldDate) {
        const newDate = prompt("Neues Datum eingeben (Format TT.MM.JJJJ):", oldDate);
        if (!newDate || newDate.trim() === "" || newDate.trim() === oldDate) return;

        document.getElementById("adminDateList").innerHTML = "Aktualisiere...";
        apiFetch(`?action=editDate&oldDate=${encodeURIComponent(oldDate)}&newDate=${encodeURIComponent(newDate.trim())}`)
            .then(res => {
                if (!res.ok) throw new Error("HTTP " + res.status);
                return res.text();
            })
            .then(() => {
                showAdminStatus(`Termin von ${oldDate} auf ${newDate.trim()} geändert.`);
                loadAdminDates();
                loadAdminData();
            })
            .catch(err => {
                console.error("editDate error:", err);
                showAdminStatus("Fehler beim Ändern: " + (err && err.message ? err.message : err), true);
                loadAdminDates();
            });
    }

    function deleteDate(date) {
        showAdminStatus(`Lösche Termin ${date}...`);
        document.getElementById("adminDateList").innerHTML = "Lösche...";

        let httpStatus = 0;
        apiFetch(`?action=deleteDate&date=${encodeURIComponent(date)}`)
            .then(res => {
                httpStatus = res.status;
                return res.text().then(txt => ({ ok: res.ok, status: res.status, txt }));
            })
            .then(({ ok, status, txt }) => {
                if (!ok) {
                    showAdminStatus(`HTTP ${status}: ${txt.slice(0, 180)}`, true);
                    loadAdminDates();
                    return;
                }
                let data;
                try {
                    data = JSON.parse(txt);
                } catch (e) {
                    showAdminStatus(`Ungültige Antwort (HTTP ${status}): "${txt.slice(0, 180)}"`, true);
                    loadAdminDates();
                    return;
                }
                if (data.error) {
                    showAdminStatus("Skriptfehler: " + data.error, true);
                } else {
                    showAdminStatus(
                        `Gelöscht (${data.delDate}): ${data.deletedTermine} Termin(e) in "${data.sheetTermineName}", ${data.deletedAntworten} Rückmeldung(en) in "${data.sheetAntwortenName}".`
                    );
                }
                loadAdminDates();
                loadAdminData();
            })
            .catch(err => {
                console.error("deleteDate error:", err);
                showAdminStatus(`Fehler beim Löschen (HTTP ${httpStatus}): ` + (err && err.message ? err.message : err), true);
                loadAdminDates();
            });
    }

    function loadDates() {
        Promise.all([
            apiFetch("?action=getDates").then(res => res.json()),
            apiFetch("?action=getUser&name=" + encodeURIComponent(currentUser)).then(res => res.json())
        ])
        .then(([dates, userVotes]) => {
            const list = document.getElementById("dateList");
            list.innerHTML = "";
            if(!Array.isArray(dates) || dates.length === 0) {
                list.innerHTML = "<p>Aktuell keine Termine geplant.</p>";
                return;
            }
            dates.forEach(date => {
                let vote = userVotes[date]; 
                list.innerHTML += renderCard(date, vote);
            });
        })
        .catch(error => {
            document.getElementById("dateList").innerHTML = "Fehler beim Laden der Termine.";
        });
    }

    function renderCard(date, vote) {
        let isKann = vote === 'Kann';
        let isKannNicht = vote === 'Kann nicht';
        
        let btnYesStyle = isKann ? "background-color: #059669; box-shadow: inset 0 0 0 3px rgba(0,0,0,0.3);" : "";
        let btnNoStyle = isKannNicht ? "background-color: #dc2626; box-shadow: inset 0 0 0 3px rgba(0,0,0,0.3);" : "";
        let statusText = vote ? `<div style="font-size: 13px; color: #10b981; margin-top: 5px; font-weight:bold;">Ihre Wahl: ${vote}</div>` : "";
        if (isKannNicht) statusText = `<div style="font-size: 13px; color: #ef4444; margin-top: 5px; font-weight:bold;">Ihre Wahl: ${vote}</div>`;

        return `
            <div class="date-card" id="card-${date}">
                <div>
                    <span style="font-weight: bold; font-size: 18px;">${date}</span>
                    ${statusText}
                </div>
                <div class="btn-group" style="width: 55%; display: flex; justify-content: space-between;">
                    <button class="btn-yes" style="${btnYesStyle}" onclick="saveStatus('${date}', 'Kann')">Kann</button>
                    <button class="btn-no" style="${btnNoStyle}" onclick="saveStatus('${date}', 'Kann nicht')">Kann nicht</button>
                </div>
            </div>
        `;
    }

    function saveStatus(date, status) {
        document.getElementById(`card-${date}`).outerHTML = renderCard(date, status);
        apiFetch(`?action=save&name=${encodeURIComponent(currentUser)}&date=${encodeURIComponent(date)}&status=${encodeURIComponent(status)}`)
            .catch(err => console.error("Speicherfehler", err));
    }

    function loadAdminData() {
        apiFetch("?action=getAdmin")
            .then(response => response.json())
            .then(data => {
                const datesMap = {};

                for(let i = 1; i < data.length; i++) {
                    let name = data[i][1];
                    let terminRaw = data[i][2];
                    let status = data[i][3];

                    let terminFormatiert = terminRaw;
                    if (typeof terminRaw === 'string' && terminRaw.includes('T')) {
                        let tDate = new Date(terminRaw);
                        terminFormatiert = ("0" + tDate.getDate()).slice(-2) + "." + ("0" + (tDate.getMonth() + 1)).slice(-2) + "." + tDate.getFullYear();
                    }

                    if (!datesMap[terminFormatiert]) datesMap[terminFormatiert] = {};
                    datesMap[terminFormatiert][name] = status;
                }

                let html = "<table><tr><th style='width: 120px;'>Termin</th><th>Rückmeldungen</th></tr>";
                
                for (let termin in datesMap) {
                    let kannList = [];
                    let kannNichtList = [];

                    for (let person in datesMap[termin]) {
                        if (datesMap[termin][person] === "Kann") kannList.push(person);
                        else kannNichtList.push(person);
                    }

                    let kannHtml = kannList.length > 0 ? kannList.join("<br>") : "<span style='color: #9ca3af; font-style: italic;'>Niemand</span>";
                    let kannNichtHtml = kannNichtList.length > 0 ? kannNichtList.join("<br>") : "<span style='color: #9ca3af; font-style: italic;'>Niemand</span>";

                    html += `<tr>
                        <td style="font-weight: bold;">${termin}</td>
                        <td>
                            <div style="color: #10b981; font-weight: bold; margin-bottom: 5px;">Kann (${kannList.length}):</div>
                            <div style="margin-bottom: 15px; line-height: 1.5;">${kannHtml}</div>
                            <details>
                                <summary style="color: #ef4444; font-weight: bold;">Kann nicht (${kannNichtList.length})</summary>
                                <div style="margin-top: 8px; line-height: 1.5; color: #4b5563;">${kannNichtHtml}</div>
                            </details>
                        </td>
                    </tr>`;
                }
                html += "</table>";
                document.getElementById("adminData").innerHTML = html;
            })
            .catch(error => {
                document.getElementById("adminData").innerHTML = "Fehler beim Abrufen der Daten.";
            });
    }
</script>
</body>
</html>
