<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PR Planung</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f3f4f6; color: #1f2937; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h1 { font-size: 1.5rem; margin-top: 0; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0 20px; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        button { background-color: #2563eb; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; transition: all 0.2s; }
        button:hover { background-color: #1d4ed8; }
        .date-card { border: 1px solid #e5e7eb; padding: 15px; border-radius: 8px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .btn-group button { width: 48%; padding: 10px; }
        .btn-yes { background-color: #10b981; } .btn-yes:hover { background-color: #059669; }
        .btn-no { background-color: #ef4444; } .btn-no:hover { background-color: #dc2626; }
        .hidden { display: none; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 15px; }
        th, td { border: 1px solid #e5e7eb; padding: 12px; text-align: left; }
        th { background-color: #f9fafb; font-size: 14px; text-transform: uppercase; color: #6b7280; }
        td { vertical-align: top; }
        details { cursor: pointer; }
        summary { outline: none; margin-bottom: 5px; }
    </style>
</head>
<body>

<div class="container" id="loginScreen">
    <h1>Anmeldung zur PR-Sitzung</h1>
    <p style="text-align: center; color: #6b7280; font-size: 14px;">Bitte Vor- und Nachnamen eingeben</p>
    <input type="text" id="userName" placeholder="z.B. Max Mustermann">
    <button onclick="login()">Weiter</button>
</div>

<div class="container hidden" id="userScreen">
    <h1 id="greeting"></h1>
    <p>Bitte geben Sie Ihre Verfügbarkeit für die kommenden Termine an. Sie können Ihre Auswahl jederzeit ändern:</p>
    <div id="dateList">Lade Termine...</div>
</div>

<div class="container hidden" id="adminScreen" style="max-width: 600px;">
    <h1>Admin Übersicht</h1>
    <div id="adminData">Lade Daten...</div>
</div>

<script>
    // HIER DIE NEUE GOOGLE APPS SCRIPT URL EINTRAGEN:
    const API_URL = "https://script.google.com/macros/s/AKfycbwoNRfzxfQsvjpCuBtLUmp0N1g1OlRL1qXismpfc1IU5b7iVTgdXFAxDb1SR40tR_D8/exec";
    let currentUser = "";

    function login() {
        currentUser = document.getElementById("userName").value.trim();
        if (currentUser === "") {
            alert("Bitte geben Sie einen Namen ein.");
            return;
        }
        
        document.getElementById("loginScreen").classList.add("hidden");
        
        if (currentUser.toLowerCase() === "admin") {
            document.getElementById("adminScreen").classList.remove("hidden");
            loadAdminData();
        } else {
            document.getElementById("userScreen").classList.remove("hidden");
            document.getElementById("greeting").innerText = "Hallo, " + currentUser;
            loadDates();
        }
    }

    function loadDates() {
        // Wir laden die Termine UND die bisherigen Antworten des Users gleichzeitig
        Promise.all([
            fetch(API_URL + "?action=getDates").then(res => res.json()),
            fetch(API_URL + "?action=getUser&name=" + encodeURIComponent(currentUser)).then(res => res.json())
        ])
        .then(([dates, userVotes]) => {
            const list = document.getElementById("dateList");
            list.innerHTML = "";
            if(dates.length === 0) {
                list.innerHTML = "<p>Aktuell keine Termine geplant.</p>";
                return;
            }
            dates.forEach(date => {
                let vote = userVotes[date]; // Hat der User hier schon abgestimmt?
                list.innerHTML += renderCard(date, vote);
            });
        })
        .catch(error => {
            document.getElementById("dateList").innerHTML = "Fehler beim Laden der Termine.";
        });
    }

    function renderCard(date, vote) {
        let isKann = vote === 'Kann';
        let isKannNicht = vote === 'Kann nicht';
        
        // Optische Hervorhebung, falls schon geklickt wurde
        let btnYesStyle = isKann ? "background-color: #059669; box-shadow: inset 0 0 0 3px rgba(0,0,0,0.3);" : "";
        let btnNoStyle = isKannNicht ? "background-color: #dc2626; box-shadow: inset 0 0 0 3px rgba(0,0,0,0.3);" : "";
        let statusText = vote ? `<div style="font-size: 13px; color: #10b981; margin-top: 5px; font-weight:bold;">Ihre Wahl: ${vote}</div>` : "";
        if (isKannNicht) statusText = `<div style="font-size: 13px; color: #ef4444; margin-top: 5px; font-weight:bold;">Ihre Wahl: ${vote}</div>`;

        return `
            <div class="date-card" id="card-${date}">
                <div>
                    <span style="font-weight: bold; font-size: 18px;">${date}</span>
                    ${statusText}
                </div>
                <div class="btn-group" style="width: 55%; display: flex; justify-content: space-between;">
                    <button class="btn-yes" style="${btnYesStyle}" onclick="saveStatus('${date}', 'Kann')">Kann</button>
                    <button class="btn-no" style="${btnNoStyle}" onclick="saveStatus('${date}', 'Kann nicht')">Kann nicht</button>
                </div>
            </div>
        `;
    }

    function saveStatus(date, status) {
        // UI sofort aktualisieren (fühlt sich schnell an)
        document.getElementById(`card-${date}`).outerHTML = renderCard(date, status);
        
        // Im Hintergrund an Google senden
        fetch(`${API_URL}?action=save&name=${encodeURIComponent(currentUser)}&date=${date}&status=${status}`)
            .catch(err => console.error("Speicherfehler", err));
    }

    function loadAdminData() {
        fetch(API_URL + "?action=getAdmin")
            .then(response => response.json())
            .then(data => {
                const datesMap = {};

                for(let i = 1; i < data.length; i++) {
                    let name = data[i][1];
                    let terminRaw = data[i][2];
                    let status = data[i][3];

                    let terminFormatiert = terminRaw;
                    if (typeof terminRaw === 'string' && terminRaw.includes('T')) {
                        let tDate = new Date(terminRaw);
                        terminFormatiert = ("0" + tDate.getDate()).slice(-2) + "." + ("0" + (tDate.getMonth() + 1)).slice(-2) + "." + tDate.getFullYear();
                    }

                    if (!datesMap[terminFormatiert]) datesMap[terminFormatiert] = {};
                    datesMap[terminFormatiert][name] = status;
                }

                let html = "<table><tr><th style='width: 120px;'>Termin</th><th>Rückmeldungen</th></tr>";
                
                for (let termin in datesMap) {
                    let kannList = [];
                    let kannNichtList = [];

                    for (let person in datesMap[termin]) {
                        if (datesMap[termin][person] === "Kann") kannList.push(person);
                        else kannNichtList.push(person);
                    }

                    let kannHtml = kannList.length > 0 ? kannList.join("<br>") : "<span style='color: #9ca3af; font-style: italic;'>Niemand</span>";
                    let kannNichtHtml = kannNichtList.length > 0 ? kannNichtList.join("<br>") : "<span style='color: #9ca3af; font-style: italic;'>Niemand</span>";

                    html += `<tr>
                        <td style="font-weight: bold;">${termin}</td>
                        <td>
                            <div style="color: #10b981; font-weight: bold; margin-bottom: 5px;">Kann (${kannList.length}):</div>
                            <div style="margin-bottom: 15px; line-height: 1.5;">${kannHtml}</div>
                            <details>
                                <summary style="color: #ef4444; font-weight: bold;">Kann nicht (${kannNichtList.length})</summary>
                                <div style="margin-top: 8px; line-height: 1.5; color: #4b5563;">${kannNichtHtml}</div>
                            </details>
                        </td>
                    </tr>`;
                }
                html += "</table>";
                document.getElementById("adminData").innerHTML = html;
            })
            .catch(error => {
                document.getElementById("adminData").innerHTML = "Fehler beim Abrufen der Daten.";
            });
    }
</script>
</body>
</html>
